/* ─── APP PRINCIPAL ─────────────────────────────────── */
function App() {
  const [currentTab, setCurrentTab]   = useState('loja');
  const [cart, setCart]               = useState([]);
  const [wishlist, setWishlist]       = useState([]);
  const [cartOpen, setCartOpen]       = useState(false);
  const [wishlistOpen, setWishlistOpen] = useState(false);
  const [rightDrawerOpen, setRightDrawerOpen] = useState(false);
  const [megaMenuOpen, setMegaMenuOpen] = useState(false);
  const [hoveredDept, setHoveredDept]   = useState(NCR_DEPARTMENTS[0]);
  const [loginModalOpen, setLoginModalOpen] = useState(false);
  const [storesModalOpen, setStoresModalOpen] = useState(false);
  const [quoteOpen, setQuoteOpen]     = useState(false);
  const [selectedService, setSelectedService] = useState(null);
  const [detailProd, setDetailProd]   = useState(null);
  const [toast, setToast]             = useState('');
  const [mobileFilterOpen, setMobileFilterOpen] = useState(false);

  // Estados dos Filtros
  const [selectedDept, setSelectedDept]       = useState('ALL');
  const [selectedCategory, setSelectedCategory] = useState('ALL');
  const [selectedBrands, setSelectedBrands]   = useState([]);
  const [selectedPriceRange, setSelectedPriceRange] = useState('ALL');
  const [selectedRAMs, setSelectedRAMs]       = useState([]);
  const [selectedScreens, setSelectedScreens] = useState([]);
  const [selectedFeatures, setSelectedFeatures] = useState({
    bluetooth: false,
    lan: false,
    netflix: false,
    subwoofer: false,
    mount: false
  });
  const [searchQuery, setSearchQuery] = useState('');
  const [sortBy, setSortBy]           = useState('featured');

  const showToast = msg => {
    setToast(msg);
    setTimeout(() => setToast(''), 3500);
  };

  const addToCart = p => {
    setCart(prev => {
      const exists = prev.find(x => x.id === p.id);
      return exists ? prev.map(x => x.id === p.id ? { ...x, qty: x.qty + 1 } : x) : [...prev, { ...p, qty: 1 }];
    });
    showToast(`✓ "${p.name}" adicionado ao carrinho!`);
  };

  const toggleWishlist = p => {
    setWishlist(prev => {
      const exists = prev.find(x => x.id === p.id);
      if (exists) {
        showToast(`Removido dos favoritos`);
        return prev.filter(x => x.id !== p.id);
      } else {
        showToast(`✓ Adicionado aos seus Favoritos!`);
        return [...prev, p];
      }
    });
  };

  const updateQty = (id, delta) => {
    setCart(prev => prev.map(p => {
      if (p.id === id) {
        const next = p.qty + delta;
        return next > 0 ? { ...p, qty: next } : null;
      }
      return p;
    }).filter(Boolean));
  };

  const cartCount = cart.reduce((a, p) => a + p.qty, 0);
  const cartTotal = cart.reduce((a, p) => a + (p.priceVal || 0) * p.qty, 0);

  // Subcategorias disponíveis
  const availableCategories = useMemo(() => {
    const subset = selectedDept === 'ALL' ? allProducts : allProducts.filter(p => p.department === selectedDept);
    const cats = new Set(subset.map(p => p.category).filter(Boolean));
    return Array.from(cats);
  }, [selectedDept]);

  // Lista de marcas
  const brandFacetList = useMemo(() => {
    const subset = selectedDept === 'ALL' ? allProducts : allProducts.filter(p => p.department === selectedDept);
    const map = {};
    subset.forEach(p => {
      if (p.brand) {
        map[p.brand] = (map[p.brand] || 0) + 1;
      }
    });
