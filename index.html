                    <h3 className="font-extrabold text-lg mb-2">Nossos Valores</h3>
                    <p className="text-xs text-gray-600 leading-relaxed">Compromisso com el cliente, transparência, segurança de dados e inovação constante.</p>
                  </div>
                </section>
              </div>
            )}

            {/* PAGE 7: CONTACTOS */}
            {page === 'contactos' && (
              <div className="animate-in fade-in duration-300 py-16 max-w-[1200px] mx-auto px-6 sm:px-10 lg:px-12">
                <div className="text-center mb-12">
                  <h1 className="text-4xl font-black text-gray-900">Entre em Contacto Connosco</h1>
                  <p className="text-xs text-gray-500 mt-2">Estamos prontos para atender a sua empresa ou residência em Luanda e em todo o território nacional.</p>
                </div>

                <div className="grid grid-cols-1 lg:grid-cols-12 gap-12">
                  <div className="lg:col-span-5 space-y-6">
                    <div className="bg-white p-6 rounded-2xl border shadow-md flex items-center space-x-4">
                      <div className="w-12 h-12 rounded-xl bg-red-50 text-brand-red flex items-center justify-center text-xl"><i className="fa-solid fa-phone"></i></div>
                      <div><h4 className="font-bold text-xs text-gray-500 uppercase">Telefone</h4><p className="font-black text-sm text-gray-900">(244) 923 457 890</p></div>
                    </div>

                    <div className="bg-white p-6 rounded-2xl border shadow-md flex items-center space-x-4">
                      <div className="w-12 h-12 rounded-xl bg-red-50 text-brand-red flex items-center justify-center text-xl"><i className="fa-solid fa-envelope"></i></div>
                      <div><h4 className="font-bold text-xs text-gray-500 uppercase">E-mail Comercial</h4><p className="font-black text-sm text-gray-900">geral@duplasdmp.co.ao</p></div>
                    </div>

                    <div className="bg-white p-6 rounded-2xl border shadow-md flex items-center space-x-4">
                      <div className="w-12 h-12 rounded-xl bg-red-50 text-brand-red flex items-center justify-center text-xl"><i className="fa-solid fa-location-dot"></i></div>
                      <div><h4 className="font-bold text-xs text-gray-500 uppercase">Localização</h4><p className="font-black text-sm text-gray-900">Luanda, Angola</p></div>
                    </div>
                  </div>

                  <div className="lg:col-span-7 bg-white p-8 rounded-2xl border shadow-md">
                    <h3 className="font-black text-lg text-gray-900 mb-4">Envie uma Mensagem Direta</h3>
                    <form onSubmit={(e) => { e.preventDefault(); showToast('Mensagem enviada! Responderemos em breve.'); }} className="space-y-4 text-xs">
                      <input type="text" required placeholder="Seu Nome Completo *" className="w-full p-3.5 border rounded-lg focus:ring-2 focus:ring-brand-red focus:outline-none" />
                      <div className="grid grid-cols-2 gap-4">
                        <input type="email" required placeholder="Seu E-mail *" className="w-full p-3.5 border rounded-lg focus:ring-2 focus:ring-brand-red focus:outline-none" />
                        <input type="tel" required placeholder="Seu Telefone *" className="w-full p-3.5 border rounded-lg focus:ring-2 focus:ring-brand-red focus:outline-none" />
                      </div>
                      <textarea rows="4" placeholder="Escreva a sua mensagem..." className="w-full p-3.5 border rounded-lg focus:ring-2 focus:ring-brand-red focus:outline-none"></textarea>
                      <button type="submit" className="w-full bg-brand-red text-white font-extrabold py-4 rounded-lg uppercase tracking-wider">ENVIAR MENSAGEM</button>
                    </form>
                  </div>
                </div>
              </div>
            )}

          </main>

          {/* FOOTER */}
          <footer className="bg-[#070A10] text-gray-400 pt-16 pb-8 border-t border-gray-800">
            <div className="max-w-[1200px] mx-auto px-6 sm:px-10 lg:px-12 grid grid-cols-1 md:grid-cols-5 gap-8 pb-12 border-b border-gray-800">
              <div className="space-y-3">
                <div className="flex items-center space-x-3">
                  <div className="w-9 h-9 rounded-full bg-brand-red text-white font-black flex items-center justify-center italic">D</div>
                  <span className="font-black text-white text-lg">Duplas <span className="text-brand-red">DMP</span></span>
                </div>
                <p className="text-xs leading-relaxed">Tecnologia que conecta. Soluções que impulsionam. A sua parceira em telecomunicações e tecnologia em Angola.</p>
              </div>

              <div>
                <h4 className="text-white text-xs font-black uppercase mb-4 border-b border-gray-800 pb-1">NAVEGAÇÃO</h4>
                <ul className="space-y-2 text-xs">
                  <li><button onClick={() => setPage('home')} className="hover:text-brand-red">Início</button></li>
                  <li><button onClick={() => setPage('internet')} className="hover:text-brand-red">Internet</button></li>
                  <li><button onClick={() => setPage('telecom')} className="hover:text-brand-red">Telecomunicações</button></li>
                  <li><button onClick={() => setPage('tecnologia')} className="hover:text-brand-red">Tecnologia</button></li>
                  <li><button onClick={() => setPage('loja')} className="hover:text-brand-red">Loja Online</button></li>
                  <li><button onClick={() => setPage('sobre')} className="hover:text-brand-red">Sobre Nós</button></li>
                  <li><button onClick={() => setPage('contactos')} className="hover:text-brand-red">Contactos</button></li>
                </ul>
              </div>

              <div>
                <h4 className="text-white text-xs font-black uppercase mb-4 border-b border-gray-800 pb-1">SERVIÇOS DE INTERNET</h4>
                <ul className="space-y-2 text-xs">
                  <li><button onClick={() => setPage('internet')} className="hover:text-brand-red">Internet Residencial (8.500 Kz)</button></li>
                  <li><button onClick={() => setPage('internet')} className="hover:text-brand-red">Internet Empresarial (Fibra)</button></li>
                  <li><button onClick={() => setPage('internet')} className="hover:text-brand-red">Links VSAT Satélite</button></li>
                </ul>
              </div>

              <div>
                <h4 className="text-white text-xs font-black uppercase mb-4 border-b border-gray-800 pb-1">CONTACTE-NOS</h4>
                <ul className="space-y-2.5 text-xs">
                  <li className="flex items-center"><i className="fa-solid fa-phone text-brand-red mr-2"></i>(244) 923 457 890</li>
                  <li className="flex items-center"><i className="fa-solid fa-envelope text-brand-red mr-2"></i>geral@duplasdmp.co.ao</li>
                  <li className="flex items-center"><i className="fa-solid fa-location-dot text-brand-red mr-2"></i>Luanda, Angola</li>
                  <li className="flex items-center"><i className="fa-solid fa-clock text-brand-red mr-2"></i>Seg - Sex: 08h - 17h</li>
                </ul>
              </div>

              <div>
                <h4 className="text-white text-xs font-black uppercase mb-4 border-b border-gray-800 pb-1">COBERTURA</h4>
                <div className="bg-[#0F1626] border border-gray-800 p-4 rounded-xl text-center">
                  <i className="fa-solid fa-globe text-brand-red text-2xl mb-2"></i>
                  <span className="text-xs font-extrabold text-white uppercase block">Cobertura Nacional em Angola</span>
                </div>
              </div>
            </div>

            <div className="max-w-[1200px] mx-auto px-6 sm:px-10 lg:px-12 pt-8 flex flex-col md:flex-row items-center justify-between text-[11px] text-gray-500">
              <p>© 2024 Duplas DMP Investment. Todos os direitos reservados.</p>
              <div className="space-x-3 mt-2 md:mt-0">
                <a href="#" className="hover:text-brand-red">Política de Privacidade</a>
                <span>|</span>
                <a href="#" className="hover:text-brand-red">Termos e Condições</a>
              </div>
            </div>
          </footer>

          {/* CART DRAWER */}
          {cartOpen && (
            <div className="fixed inset-0 z-50 flex justify-end">
              <div onClick={() => setCartOpen(false)} className="fixed inset-0 bg-black/60 backdrop-blur-sm"></div>
              <div className="relative w-full max-w-md bg-white h-full shadow-2xl p-6 flex flex-col justify-between z-10">
                <div>
                  <div className="flex justify-between items-center pb-4 border-b border-gray-200">
                    <h3 className="font-black text-sm uppercase">Carrinho de Compras ({cartCount})</h3>
                    <button onClick={() => setCartOpen(false)} className="text-gray-400 hover:text-gray-700"><i className="fa-solid fa-xmark text-lg"></i></button>
                  </div>
                  <div className="py-4 space-y-3 overflow-y-auto max-h-[60vh]">
                    {cart.length === 0 ? (
                      <p className="text-xs text-gray-500 text-center py-8">O carrinho está vazio</p>
                    ) : cart.map(item => (
                      <div key={item.id} className="flex justify-between items-center bg-gray-50 p-3 rounded-lg border">
                        <div>
                          <h4 className="font-bold text-xs">{item.name}</h4>
                          <span className="text-xs text-brand-red font-extrabold">{item.priceStr}</span>
                          <div className="flex items-center space-x-2 mt-1">
                            <button onClick={() => updateQty(item.id, -1)} className="w-5 h-5 bg-white border rounded text-xs">-</button>
                            <span className="text-xs font-bold">{item.qty}</span>
                            <button onClick={() => updateQty(item.id, 1)} className="w-5 h-5 bg-white border rounded text-xs">+</button>
                          </div>
                        </div>
                        <button onClick={() => removeFromCart(item.id)} className="text-gray-400 hover:text-brand-red p-2"><i className="fa-solid fa-trash text-xs"></i></button>
                      </div>
                    ))}
                  </div>
                </div>
                {cart.length > 0 && (
                  <div className="border-t pt-4 space-y-3">
                    <div className="flex justify-between font-black text-sm"><span>Subtotal:</span><span className="text-brand-red">{totalKz.toLocaleString('pt-AO')} Kz</span></div>
                    <button onClick={() => { alert('Encomenda enviada!'); setCart([]); setCartOpen(false); }} className="w-full bg-brand-red text-white font-bold text-xs py-3.5 rounded-lg uppercase">Finalizar Encomenda</button>
                  </div>
                )}
              </div>
            </div>
          )}

          {/* QUOTE MODAL */}
          {quoteOpen && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4">
              <div onClick={() => setQuoteOpen(false)} className="fixed inset-0 bg-black/70 backdrop-blur-sm"></div>
              <div className="relative bg-white rounded-2xl max-w-lg w-full p-6 shadow-2xl z-10 space-y-4">
                <div className="flex justify-between items-center border-b pb-3">
                  <h3 className="font-black text-base uppercase text-gray-900">PEDIR COTAÇÃO</h3>
                  <button onClick={() => setQuoteOpen(false)} className="text-gray-400 hover:text-gray-700"><i className="fa-solid fa-xmark text-lg"></i></button>
                </div>
                <form onSubmit={(e) => { e.preventDefault(); showToast('Pedido de cotação enviado com sucesso!'); setQuoteOpen(false); }} className="space-y-3 text-xs">
                  <input type="text" required placeholder="Nome Completo *" className="w-full p-3 border rounded-lg focus:ring-2 focus:ring-brand-red focus:outline-none" />
                  <input type="email" required placeholder="E-mail *" className="w-full p-3 border rounded-lg focus:ring-2 focus:ring-brand-red focus:outline-none" />
                  <input type="tel" required placeholder="Telefone (+244) *" className="w-full p-3 border rounded-lg focus:ring-2 focus:ring-brand-red focus:outline-none" />
                  <textarea rows="3" placeholder="Mensagem / Detalhes do Projeto..." className="w-full p-3 border rounded-lg focus:ring-2 focus:ring-brand-red focus:outline-none"></textarea>
                  <button type="submit" className="w-full bg-brand-red hover:bg-brand-redHover text-white font-extrabold py-3.5 rounded-lg uppercase tracking-wider">ENVIAR PEDIDO DE COTAÇÃO</button>
                </form>
              </div>
            </div>
          )}

          {/* PRODUCT DETAIL MODAL */}
          {detailProduct && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4">
              <div onClick={() => setDetailProduct(null)} className="fixed inset-0 bg-black/70 backdrop-blur-sm"></div>
              <div className="relative bg-white rounded-2xl max-w-xl w-full p-6 shadow-2xl z-10">
                <button onClick={() => setDetailProduct(null)} className="absolute top-4 right-4 text-gray-400 hover:text-gray-700"><i className="fa-solid fa-xmark text-lg"></i></button>
                <div className="grid grid-cols-1 sm:grid-cols-2 gap-6">
                  <div className="bg-gray-50 rounded-xl p-4 flex items-center justify-center border">
                    <img src={detailProduct.img} alt={detailProduct.name} className="max-h-48 object-contain" />
                  </div>
                  <div className="flex flex-col justify-between space-y-3">
                    <div>
                      <span className="text-[10px] font-bold text-brand-red bg-red-50 px-2 py-0.5 rounded-full uppercase">{detailProduct.category}</span>
                      <h3 className="text-lg font-black text-gray-900 mt-1">{detailProduct.name}</h3>
                      <p className="text-xs text-gray-500">{detailProduct.subtitle}</p>
                      <span className="text-xl font-black text-brand-red block mt-2">{detailProduct.priceStr}</span>
                      <div className="mt-3 space-y-1">
                        <h4 className="text-[11px] font-bold uppercase text-gray-700">Especificações:</h4>
                        <ul className="space-y-1">
                          {detailProduct.specs.map((s, i) => (
                            <li key={i} className="text-xs text-gray-600 flex items-center"><i className="fa-solid fa-circle-check text-brand-red mr-2 text-[10px]"></i>{s}</li>
                          ))}
                        </ul>
                      </div>
                    </div>
                    <button onClick={() => { addToCart(detailProduct); setDetailProduct(null); }} className="w-full bg-brand-red hover:bg-brand-redHover text-white font-extrabold text-xs uppercase py-3 rounded-lg">
                      ADICIONAR AO CARRINHO
                    </button>
                  </div>
                </div>
              </div>
            </div>
          )}

          {/* WHATSAPP FLOATING BUTTON */}
          <a href="https://wa.me/244923457890" target="_blank" className="fixed bottom-6 right-6 z-40 w-14 h-14 bg-green-500 hover:bg-green-600 text-white rounded-full flex items-center justify-center shadow-2xl hover:scale-110 transition-all">
            <i className="fa-brands fa-whatsapp text-3xl"></i>
          </a>

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
