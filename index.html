function App() {
  const [page, setPage]             = useState('home');
  const [cart, setCart]             = useState([]);
  const [cartOpen, setCartOpen]     = useState(false);
  const [quoteOpen, setQuoteOpen]   = useState(false);
  const [detailProd, setDetailProd] = useState(null);
  const [toast, setToast]           = useState('');
  const [mobileMenu, setMobileMenu] = useState(false);

  // Estados dos Filtros da Loja
  const [selectedCat, setSelectedCat]       = useState('ALL');
  const [selectedSubCat, setSelectedSubCat] = useState('ALL');
  const [searchQuery, setSearchQuery]       = useState('');
  const [priceRange, setPriceRange]         = useState('ALL');
  const [selectedBrand, setSelectedBrand]   = useState('ALL');
  const [filterRAM, setFilterRAM]           = useState('ALL');
  const [filterScreen, setFilterScreen]     = useState('ALL');
  const [filterBluetooth, setFilterBluetooth] = useState(false);
  const [filterLAN, setFilterLAN]           = useState(false);
  const [filterNetflix, setFilterNetflix]   = useState(false);
  const [filterSubwoofer, setFilterSubwoofer] = useState(false);
  const [sortBy, setSortBy]                 = useState('featured');

  useEffect(() => {
    window.scrollTo({ top: 0, behavior: 'smooth' });
    setMobileMenu(false);
  }, [page]);

  const showToast = msg => {
    setToast(msg);
    setTimeout(() => setToast(''), 3500);
  };

  const addToCart = p => {
    setCart(prev => {
      const exists = prev.find(x => x.id === p.id);
      return exists ? prev.map(x => x.id === p.id ? { ...x, qty: x.qty + 1 } : x) : [...prev, { ...p, qty: 1 }];
    });
    showToast(`✓ "${p.name}" adicionado ao carrinho!`);
  };

  const updateQty = (id, delta) => {
    setCart(prev => prev.map(p => {
      if (p.id === id) {
        const next = p.qty + delta;
        return next > 0 ? { ...p, qty: next } : null;
      }
      return p;
    }).filter(Boolean));
  };

  const cartCount = cart.reduce((a, p) => a + p.qty, 0);
  const cartTotal = cart.reduce((a, p) => a + (p.priceVal || 0) * p.qty, 0);

  // Lista única de marcas para os filtros
  const availableBrands = useMemo(() => {
    const brands = new Set(productsData.map(p => p.brand).filter(Boolean));
    return ['ALL', ...Array.from(brands)];
  }, []);

  // Lista de RAMs disponíveis
  const availableRAMs = useMemo(() => {
    const rams = new Set(productsData.map(p => p.ram).filter(Boolean));
    return ['ALL', ...Array.from(rams)];
  }, []);

  // Lista de tamanhos de ecrã disponíveis
  const availableScreens = useMemo(() => {
    const screens = new Set(productsData.map(p => p.screenSize).filter(Boolean));
    return ['ALL', ...Array.from(screens)];
  }, []);

  // Filtragem e Ordenação dos Produtos
  const filteredProducts = useMemo(() => {
    return productsData.filter(p => {
      // Categoria
      if (selectedCat !== 'ALL' && p.category !== selectedCat) return false;
      // Subcategoria
      if (selectedSubCat !== 'ALL' && p.subCategory !== selectedSubCat) return false;
      // Marca
      if (selectedBrand !== 'ALL' && p.brand !== selectedBrand) return false;
      // Faixa de Preço
      if (priceRange === 'under50k' && p.priceVal >= 50000) return false;
      if (priceRange === '50k-200k' && (p.priceVal < 50000 || p.priceVal > 200000)) return false;
      if (priceRange === '200k-1000k' && (p.priceVal < 200000 || p.priceVal > 1000000)) return false;
      if (priceRange === 'over1000k' && p.priceVal <= 1000000) return false;
      // RAM
      if (filterRAM !== 'ALL' && p.ram !== filterRAM) return false;
      // Polegadas
      if (filterScreen !== 'ALL' && p.screenSize !== filterScreen) return false;
      // Especificações booleanas
      if (filterBluetooth && !p.hasBluetooth) return false;
      if (filterLAN && !p.hasLAN) return false;
      if (filterNetflix && !p.hasNetflix) return false;
      if (filterSubwoofer && !p.hasSubwoofer) return false;
      // Pesquisa por texto
      if (searchQuery.trim()) {
        const q = searchQuery.toLowerCase();
        const matchesName = p.name.toLowerCase().includes(q);
        const matchesSubtitle = p.subtitle.toLowerCase().includes(q);
        const matchesBrand = (p.brand || '').toLowerCase().includes(q);
        const matchesSpecs = (p.specs || []).some(s => s.toLowerCase().includes(q));
        const matchesSKU = (p.sku || '').toLowerCase().includes(q);
        if (!matchesName && !matchesSubtitle && !matchesBrand && !matchesSpecs && !matchesSKU) return false;
      }
      return true;
    }).sort((a, b) => {
      if (sortBy === 'priceAsc') return a.priceVal - b.priceVal;
      if (sortBy === 'priceDesc') return b.priceVal - a.priceVal;
      if (sortBy === 'nameAsc') return a.name.localeCompare(b.name);
      return 0; // featured
    });
  }, [selectedCat, selectedSubCat, selectedBrand, priceRange, filterRAM, filterScreen, filterBluetooth, filterLAN, filterNetflix, filterSubwoofer, searchQuery, sortBy]);

  const clearAllFilters = () => {
    setSelectedCat('ALL');
    setSelectedSubCat('ALL');
    setSelectedBrand('ALL');
    setPriceRange('ALL');
    setFilterRAM('ALL');
    setFilterScreen('ALL');
    setFilterBluetooth(false);
    setFilterLAN(false);
    setFilterNetflix(false);
    setFilterSubwoofer(false);
    setSearchQuery('');
  };

  /* ── TOP BAR ── */

        <div className="flex items-center space-x-6 flex-shrink-0">
          <span className="flex items-center space-x-2"><i className="fa-brands fa-whatsapp text-emerald-400 text-xs"></i><span>+244 941 950 022</span></span>
          <span className="flex items-center space-x-2"><i className="fa-solid fa-phone text-brand-red text-xs"></i><span>+244 947 077 913</span></span>
          <span className="flex items-center space-x-2"><i className="fa-solid fa-envelope text-brand-red text-xs"></i><span>geral@duplasdmp.co.ao</span></span>
          <span className="flex items-center space-x-2"><i className="fa-solid fa-clock text-brand-red text-xs"></i><span>Seg–Sex: 08h–17h</span></span>
        </div>
      </div>
    </div>
  );

  /* ── HEADER COM DEPARTAMENTOS & NAVEGAÇÃO ── */

    <header className="sticky top-0 z-50 bg-white border-b border-gray-200 shadow-sm transition-all">
      <div className="w-full px-4 sm:px-7 lg:px-10 h-24 md:h-28 flex items-center justify-between gap-4">
        
        {/* LOGOMARCA */}
        <button onClick={() => setPage('home')} className="flex-shrink-0 py-2 flex items-center space-x-3 text-left group">
          <img
            src={LOGO_ONLINE}
            alt="Duplas DMP Investment"

          />

          <input
            type="text"
            placeholder="Pesquisar portáteis, TVs, auscultadores, impressoras, ar condicionado..."
            value={searchQuery}

              setSearchQuery(e.target.value);
