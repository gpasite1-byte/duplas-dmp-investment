                      className={`px-4 py-2.5 rounded-lg text-xs font-bold uppercase transition-all ${shopCategory === cat ? 'bg-brand-red text-white shadow scale-105' : 'bg-gray-200 text-gray-700 hover:bg-gray-300'}`}
                    >
                      {cat === 'ALL' ? 'Todos os Produtos' : cat}
                    </button>
                  ))}
                </div>

                <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6">
                  {productsData
                    .filter(p => shopCategory === 'ALL' || p.category === shopCategory)
                    .filter(p => p.name.toLowerCase().includes(searchQuery.toLowerCase()))
                    .map((p) => (
                      <div key={p.id} className="bg-white rounded-2xl border border-gray-200 p-5 flex flex-col justify-between card-hover">
                        <div className="bg-gray-50 rounded-xl p-4 flex items-center justify-center h-48 relative img-zoom">
                          <img src={p.img} alt={p.name} className="max-h-40 object-contain" />
                        </div>
                        <div className="my-4">
                          <span className="text-[10px] font-bold text-brand-red bg-red-50 px-2.5 py-1 rounded-full uppercase">{p.category}</span>
                          <h3 className="font-bold text-sm text-gray-900 mt-2">{p.name}</h3>
                          <p className="text-xs text-gray-500">{p.subtitle}</p>
                          <span className="text-lg font-black text-brand-red block mt-2">{p.priceStr}</span>
                        </div>
                        <button onClick={() => addToCart(p)} className="w-full bg-brand-red hover:bg-brand-redHover text-white font-extrabold text-xs uppercase py-3 rounded-lg shadow">
                          ADICIONAR AO CARRINHO
                        </button>
                      </div>
                    ))}
                </div>
              </div>
            )}

            {/* PAGE 6: SOBRE NÓS */}
            {page === 'sobre' && (
              <div className="animate-fade-in-up py-16 max-w-7xl mx-auto px-4 lg:px-8 text-center space-y-6">
                <span className="bg-brand-red text-white text-xs font-bold px-3 py-1 rounded-full uppercase">QUEM SOMOS</span>
                <h1 className="text-4xl font-black text-gray-900">Sobre a Duplas DMP Investment</h1>
                <p className="text-sm text-gray-600 max-w-2xl mx-auto leading-relaxed">Mais de 10 anos de liderança e compromisso com o mercado Angolano em telecomunicações, internet de alta velocidade e projetos de engenharia tecnológica.</p>
              </div>
            )}

            {/* PAGE 7: CONTACTOS */}
            {page === 'contactos' && (
              <div className="animate-fade-in-up py-16 max-w-7xl mx-auto px-4 lg:px-8 text-center space-y-6">
                <span className="bg-brand-red text-white text-xs font-bold px-3 py-1 rounded-full uppercase">FALE CONNOSCO</span>
                <h1 className="text-4xl font-black text-gray-900">Contactos Comercial & Suporte</h1>
                <p className="text-sm text-gray-600">Telefone: (244) 923 457 890 | E-mail: geral@duplasdmp.co.ao | Luanda, Angola</p>
              </div>
            )}
          </main>

          {/* 3. FOOTER (COM COR BRANCA APENAS EM 'Duplas' E 'Investment', E 'DMP' EM VERMELHO!) */}

            <div className="max-w-7xl mx-auto px-4 lg:px-8">
              
              <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-5 gap-10 pb-12 border-b border-gray-800/80">
                
                {/* FOOTER LOGO: 'Duplas' em BRANCO, 'DMP' em VERMELHO, 'Investment' em BRANCO */}
                <div className="space-y-4 lg:col-span-1">
                  <button onClick={() => setPage('home')} className="flex items-center space-x-3 text-left group">
                    <div className="w-12 h-12 rounded-full bg-gradient-to-br from-brand-red to-red-800 flex items-center justify-center text-white font-black text-2xl italic shadow-md shadow-brand-red/30 group-hover:scale-110 transition-transform">
                      D
                    </div>
                    <div className="flex flex-col">
                      <span className="font-black text-xl text-white tracking-tight leading-none">
                        Duplas <span className="text-brand-red font-extrabold uppercase">DMP</span>
                      </span>
                      <span className="text-[10px] font-bold text-white tracking-widest uppercase mt-0.5">
                        Investment
                      </span>
                    </div>
                  </button>

                    Tecnologia que conecta. Soluções que impulsionam. A sua parceira em telecomunicações e tecnologia em Angola.
                  </p>

                  <div className="flex items-center space-x-2 pt-2">

                        <i className={`fa-brands fa-${s} text-xs`}></i>
                      </a>
                    ))}
                  </div>
                </div>

                {/* LINKS RÁPIDOS (SINGLE TITLE ON HOVER) */}

                  <h4 className="text-white text-xs font-black uppercase tracking-wider mb-4 border-b border-gray-800 pb-2">
                    LINKS RÁPIDOS
                  </h4>
                  <ul className="space-y-2.5 text-xs">
                    <li><button onClick={() => setPage('home')} className="hover:text-white transition-colors flex items-center space-x-1.5"><span className="text-brand-red">›</span><span>Início</span></button></li>
                    <li><button onClick={() => setPage('sobre')} className="hover:text-white transition-colors flex items-center space-x-1.5"><span className="text-brand-red">›</span><span>Sobre Nós</span></button></li>
                    <li><button onClick={() => setPage('telecom')} className="hover:text-white transition-colors flex items-center space-x-1.5"><span className="text-brand-red">›</span><span>Serviços</span></button></li>
                    <li><button onClick={() => setPage('loja')} className="hover:text-white transition-colors flex items-center space-x-1.5"><span className="text-brand-red">›</span><span>Loja</span></button></li>
                    <li><button onClick={() => setPage('contactos')} className="hover:text-white transition-colors flex items-center space-x-1.5"><span className="text-brand-red">›</span><span>Contactos</span></button></li>
                    <li><button onClick={() => setQuoteOpen(true)} className="hover:text-white transition-colors flex items-center space-x-1.5"><span className="text-brand-red">›</span><span>Pedir Cotação</span></button></li>
                  </ul>
                </div>

                {/* NOSSOS SERVIÇOS (SINGLE TITLE ON HOVER) */}
                <div>
                  <h4 className="text-white text-xs font-black uppercase tracking-wider mb-4 border-b border-gray-800 pb-2">
                    NOSSOS SERVIÇOS
                  </h4>
                  <ul className="space-y-2.5 text-xs">
                    <li><button onClick={() => setPage('internet')} className="hover:text-white transition-colors flex items-center space-x-1.5"><span className="text-brand-red">›</span><span>Internet Residencial</span></button></li>
                    <li><button onClick={() => setPage('internet')} className="hover:text-white transition-colors flex items-center space-x-1.5"><span className="text-brand-red">›</span><span>Internet Empresarial</span></button></li>
                    <li><button onClick={() => setPage('telecom')} className="hover:text-white transition-colors flex items-center space-x-1.5"><span className="text-brand-red">›</span><span>Telecomunicações</span></button></li>
                    <li><button onClick={() => setPage('tecnologia')} className="hover:text-white transition-colors flex items-center space-x-1.5"><span className="text-brand-red">›</span><span>Redes e Infraestrutura</span></button></li>
                    <li><button onClick={() => setPage('tecnologia')} className="hover:text-white transition-colors flex items-center space-x-1.5"><span className="text-brand-red">›</span><span>Segurança Eletrónica</span></button></li>
                    <li><button onClick={() => setPage('telecom')} className="hover:text-white transition-colors flex items-center space-x-1.5"><span className="text-brand-red">›</span><span>Suporte Técnico 24/7</span></button></li>
                  </ul>
                </div>

                {/* CONTACTE-NOS */}
                <div>
                  <h4 className="text-white text-xs font-black uppercase tracking-wider mb-4 border-b border-gray-800 pb-2">
                    CONTACTE-NOS
                  </h4>
                  <ul className="space-y-3 text-xs">
                    <li className="flex items-start space-x-2.5">
                      <i className="fa-solid fa-phone text-brand-red mt-0.5"></i>
                      <span className="text-gray-300 font-semibold">(244) 923 457 890</span>
                    </li>
                    <li className="flex items-start space-x-2.5">
                      <i className="fa-solid fa-envelope text-brand-red mt-0.5"></i>
                      <span className="text-gray-300 font-medium">geral@duplasdmp.co.ao</span>
                    </li>
                    <li className="flex items-start space-x-2.5">
                      <i className="fa-solid fa-location-dot text-brand-red mt-0.5"></i>
                      <span>Luanda, Angola</span>
                    </li>
                    <li className="flex items-start space-x-2.5">
                      <i className="fa-solid fa-clock text-brand-red mt-0.5"></i>
                      <span>Seg - Sex: 08h - 17h</span>
                    </li>
                  </ul>
                </div>

                {/* COBERTURA ANGOLA */}

                  <h4 className="text-white text-xs font-black uppercase tracking-wider mb-4 border-b border-gray-800 pb-2 flex items-center">
                    <i className="fa-solid fa-globe text-brand-red mr-1.5"></i>
                    COBERTURA
                  </h4>
                  
                  <div className="bg-[#0F1626] border border-gray-800 rounded-xl p-4 text-center relative overflow-hidden group hover:border-brand-red/40 transition-colors">
                    <div className="relative w-full h-24 flex items-center justify-center">
                      <i className="fa-solid fa-map-location-dot text-4xl text-gray-700 animate-float"></i>
                      <span className="absolute top-6 left-12 w-2.5 h-2.5 bg-brand-red rounded-full animate-ping"></span>
                      <span className="absolute top-6 left-12 w-2.5 h-2.5 bg-brand-red rounded-full"></span>
                    </div>
                    <span className="text-[11px] font-extrabold text-white block mt-1 uppercase tracking-wider">
                      Cobertura Nacional

                  </div>
                </div>

              </div>

              {/* COPYRIGHT */}
              <div className="pt-8 flex flex-col md:flex-row items-center justify-between text-[11px] text-gray-500">
                <p>© 2024 Duplas DMP Investment. Todos os direitos reservados.</p>
                <div className="flex space-x-4 mt-3 md:mt-0">
                  <a href="#" className="hover:text-brand-red transition-colors">Política de Privacidade</a>
                  <span>|</span>
                  <a href="#" className="hover:text-brand-red transition-colors">Termos e Condições</a>
                </div>
              </div>

            </div>
          </footer>

          {/* CART DRAWER */}
          {cartOpen && (
            <div className="fixed inset-0 z-50 flex justify-end animate-fade-in-scale">
              <div onClick={() => setCartOpen(false)} className="fixed inset-0 bg-black/60 backdrop-blur-sm"></div>
              <div className="relative w-full max-w-md bg-white h-full shadow-2xl flex flex-col z-10">
                <div className="flex justify-between items-center p-5 border-b">
                  <h3 className="font-extrabold text-base uppercase">Carrinho ({cartCount})</h3>
                  <button onClick={() => setCartOpen(false)} className="p-2 hover:bg-gray-100 rounded-full"><i className="fa-solid fa-xmark"></i></button>
                </div>
                <div className="flex-1 overflow-y-auto p-5 space-y-3">
                  {cart.length === 0 ? (
                    <p className="text-center text-gray-400 text-sm py-12">O carrinho está vazio</p>
                  ) : (
                    cart.map(item => (
                      <div key={item.id} className="flex space-x-3 bg-gray-50 p-3 rounded-xl border">
                        <img src={item.img} className="w-14 h-14 object-contain" />
                        <div className="flex-1">
                          <p className="font-bold text-xs text-gray-900">{item.name}</p>
                          <p className="text-brand-red font-black text-sm">{item.priceStr}</p>
                          <div className="flex items-center space-x-2 mt-1">
                            <button onClick={() => updateQty(item.id, -1)} className="w-6 h-6 rounded bg-gray-200 text-xs font-bold">-</button>
                            <span className="text-xs font-bold w-4 text-center">{item.qty}</span>
                            <button onClick={() => updateQty(item.id, 1)} className="w-6 h-6 rounded bg-gray-200 text-xs font-bold">+</button>
                          </div>
                        </div>
                      </div>
                    ))
                  )}
                </div>
                {cart.length > 0 && (
                  <div className="p-5 border-t space-y-3">
                    <div className="flex justify-between font-extrabold text-sm">
                      <span>Subtotal</span>
                      <span className="text-brand-red text-lg">{totalKz.toLocaleString('pt-AO')} Kz</span>
                    </div>
                    <button onClick={() => { alert('Encomenda enviada!'); setCart([]); setCartOpen(false); }} className="w-full bg-brand-red text-white font-extrabold text-xs uppercase py-4 rounded-lg shadow">FINALIZAR ENCOMENDA</button>
                  </div>
                )}
              </div>
            </div>
          )}

          {/* QUOTE MODAL */}
          {quoteOpen && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4">
              <div onClick={() => setQuoteOpen(false)} className="fixed inset-0 bg-black/70 backdrop-blur-sm"></div>
              <div className="relative bg-white rounded-2xl max-w-md w-full shadow-2xl z-10 overflow-hidden animate-fade-in-scale">
                <div className="bg-[#070A10] px-6 py-4 flex justify-between items-center text-white">
                  <h3 className="font-extrabold uppercase text-sm">PEDIR COTAÇÃO</h3>
                  <button onClick={() => setQuoteOpen(false)} className="p-1 hover:text-brand-red"><i className="fa-solid fa-xmark"></i></button>
                </div>
                <form onSubmit={e => { e.preventDefault(); showToast('✓ Pedido de cotação enviado com sucesso!'); setQuoteOpen(false); }} className="p-6 space-y-3.5">
                  <input type="text" required placeholder="Nome Completo *" className="w-full p-3 border rounded-xl text-xs bg-gray-50" />
                  <input type="email" required placeholder="E-mail *" className="w-full p-3 border rounded-xl text-xs bg-gray-50" />
                  <input type="tel" required placeholder="Telefone (+244) *" className="w-full p-3 border rounded-xl text-xs bg-gray-50" />
                  <select className="w-full p-3 border rounded-xl text-xs bg-gray-50">
                    <option>Tipo de serviço pretendido...</option>
                    <option>Internet Residencial</option>
                    <option>Internet Empresarial</option>
                    <option>Telecomunicações PABX/VoIP</option>
                    <option>Segurança CCTV IP</option>
                  </select>
                  <textarea rows="3" placeholder="Detalhes do projeto..." className="w-full p-3 border rounded-xl text-xs bg-gray-50 resize-none"></textarea>
                  <button type="submit" className="w-full bg-brand-red text-white font-extrabold text-xs uppercase py-3.5 rounded-xl shadow">ENVIAR PEDIDO</button>
                </form>
              </div>
            </div>
          )}

          {/* PRODUCT DETAIL MODAL */}
          {detailProduct && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4">
              <div onClick={() => setDetailProduct(null)} className="fixed inset-0 bg-black/70 backdrop-blur-sm"></div>
              <div className="relative bg-white rounded-2xl max-w-lg w-full shadow-2xl z-10 overflow-hidden animate-fade-in-scale p-6">
                <button onClick={() => setDetailProduct(null)} className="absolute top-4 right-4 p-2 text-gray-400 hover:text-gray-900"><i className="fa-solid fa-xmark text-lg"></i></button>
                <div className="flex justify-center h-48 bg-gray-50 rounded-xl p-4 mb-4">
                  <img src={detailProduct.img} className="max-h-40 object-contain" />
                </div>
                <span className="text-[10px] font-bold text-brand-red bg-red-50 px-2.5 py-1 rounded-full uppercase">{detailProduct.category}</span>
                <h3 className="font-extrabold text-lg text-gray-900 mt-2">{detailProduct.name}</h3>
                <p className="text-xs text-gray-500 mb-2">{detailProduct.subtitle}</p>
                <span className="text-2xl font-black text-brand-red block mb-4">{detailProduct.priceStr}</span>
                {detailProduct.specs && (
                  <ul className="space-y-1.5 text-xs text-gray-600 mb-6">
                    {detailProduct.specs.map((s, idx) => (
                      <li key={idx} className="flex items-center"><i className="fa-solid fa-circle-check text-brand-red mr-2"></i>{s}</li>
                    ))}
                  </ul>
                )}
                <button onClick={() => { addToCart(detailProduct); setDetailProduct(null); }} className="w-full bg-brand-red text-white font-extrabold text-xs uppercase py-3.5 rounded-xl shadow">
                  ADICIONAR AO CARRINHO
                </button>
              </div>
            </div>
          )}

          {/* WHATSAPP FAB */}
          <a href="https://wa.me/244923457890" target="_blank" title="Falar no WhatsApp" className="fixed bottom-6 right-6 z-40 w-14 h-14 bg-green-500 hover:bg-green-600 text-white rounded-full flex items-center justify-center shadow-2xl hover:scale-110 transition-all pulse-red">
            <i className="fa-brands fa-whatsapp text-3xl"></i>
          </a>

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
  </script>
