        <div className="fixed top-4 right-4 z-[100] bg-brand-dark text-white px-5 py-3.5 rounded-xl shadow-2xl border border-brand-red/40 flex items-center space-x-3 font-body text-sm font-medium max-w-xs">
          {toast}
        </div>
      )}

      <TopBar/>
      <Header/>

      <main className="flex-1">
        {page==='home'       && <HomePage/>}
        {page==='internet'   && <InternetPage/>}
        {page==='telecom'    && <TelecomPage/>}
        {page==='tecnologia' && <TecnologiaPage/>}
        {page==='loja'       && <LojaPage/>}
        {page==='sobre'      && <SobrePage/>}
        {page==='contactos'  && <ContactosPage/>}
      </main>

      <Footer/>
      <CartDrawer/>
      <QuoteModal/>
      <ProductModal/>

      {/* WhatsApp FAB */}
      <a href="https://wa.me/244923457890" target="_blank"
        className="fixed bottom-6 right-6 z-40 w-14 h-14 bg-green-500 hover:bg-green-600 text-white rounded-full flex items-center justify-center shadow-2xl hover:scale-110 transition-all">
        <i className="fa-brands fa-whatsapp text-3xl"></i>
      </a>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
